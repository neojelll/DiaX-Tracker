# Dependency and action updates arrive as PRs on their own; CI on each PR (compile, tests, lint,
# dev build) is the safety net before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    # Weekly, ahead of the weekly release.
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # chore: dependency bumps stay out of the changelog. The group titles keep PR titles within
    # the 70-character title check (a single long artifact name wouldn't).
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Kotlin and KSP versions are tied (KSP is built per Kotlin version) - they move together.
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - com.google.devtools.ksp*
      android-gradle-plugin:
        patterns:
          - com.android.*
      androidx:
        patterns:
          - androidx.*
      libraries:
        patterns:
          - "*"
    ignore:
      # Major versions of the Android stack usually need code changes - picked up on purpose,
      # not as a weekly bump.
      - dependency-name: org.jetbrains.kotlin*
        update-types: [version-update:semver-major]
      - dependency-name: com.android.*
        update-types: [version-update:semver-major]
      - dependency-name: androidx.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
