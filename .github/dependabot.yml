# Dependency and action updates arrive as PRs on their own; CI on each PR is the safety net before
# merging. The Android app (android/) is frozen at v0.4.0-beta.1, so its Gradle dependencies are not
# watched any more.
version: 2
updates:
  # The PWA's npm packages; minor and patch bumps grouped into one weekly PR.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node major pinned in mise.toml, not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
