name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main

# Least-privilege default for the whole workflow: only what checkout needs. A job
# that needs more scopes it for itself (see check-title below); ci-gate needs none.
permissions:
  contents: read

# A new push to the same PR (or to main) makes the previous run's result moot -
# cancel it instead of burning time finishing a check nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Skip on a title/description-only edit - nothing to (re)build, and the previous
    # run's status for this commit SHA still stands.
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle User Home - dependencies, the wrapper, transformed Android libraries and the
      # local build cache. Runs on main write the cache; PR runs only read it, so a PR can't
      # poison what main restores. A misbehaving cache is reset by deleting it under Actions > Caches.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # --build-cache: reuse task outputs from earlier runs. Fine in CI - a bad entry only costs a
      # re-run; the release build (release.yml) never uses it.
      - name: Compile
        run: ./gradlew --build-cache compileDebugKotlin

      - name: Unit tests
        run: ./gradlew --build-cache testDebugUnitTest

      - name: Lint
        run: ./gradlew --build-cache lintDebug

      # Tests above cover the shared code; this only keeps the dev variant (its own
      # applicationId, signing and resource overrides) from silently breaking.
      - name: Build dev variant
        run: ./gradlew --build-cache assembleDev

      # Failed tests show up right on the PR (annotations) and in the run's summary, instead of only
      # inside the downloadable HTML report. annotate_only needs no checks:write - so it also works
      # on Dependabot PRs, whose token is read-only.
      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          annotate_only: true
          job_summary: true
          require_tests: false

      # The full HTML report stays downloadable as a fallback.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

  check-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The action below checks the subject's format but not the total length, so the
      # commit-conventions skill's 70-char budget needs this separate step. The title
      # is read via env, not `${{ }}` inside run: - a PR title is attacker-controlled,
      # and inlining it would let a crafted one execute as shell.
      - name: Check title length
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          len=$(printf '%s' "$TITLE" | wc -m)
          if [ "$len" -gt 70 ]; then
            echo "::error::PR title is $len characters (limit 70, leaving room for the \" (#123)\" GitHub appends on squash-merge): $TITLE"
            exit 1
          fi

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v5.5.2
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary after "type: " (or "type(scope): ") must start with a lowercase
            letter, e.g. "feat: add X", not "feat: Add X".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required check for branch protection: everything above gets `needs:`-ed in
  # here instead of being added to the protection rule one by one. A job that was
  # skipped on purpose (see the `if:`s above) doesn't fail the gate - only an actual
  # failure or cancellation does.
  ci-gate:
    name: CI gate
    if: always()
    permissions: {}
    needs:
      - build-and-test
      - check-title
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
