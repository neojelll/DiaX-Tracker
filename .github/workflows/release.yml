name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk diax-tracker-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: diax-tracker-${{ github.ref_name }}.apk
          generate_release_notes: true
