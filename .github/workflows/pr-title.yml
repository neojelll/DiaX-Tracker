name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary after "type: " (or "type(scope): ") must start with a lowercase
            letter, e.g. "feat: add X", not "feat: Add X".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
