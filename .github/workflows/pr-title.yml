name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      # The action below has no total-length input, only per-subject regexes - the
      # commit-conventions skill's 70-char budget (room for the " (#123)" GitHub
      # appends on squash-merge) needs its own check. The title comes in via env,
      # never interpolated into the script itself - a PR title is attacker-controlled
      # text (this repo takes PRs from anyone), and `${{ }}` inside `run:` would paste
      # it into the shell script before it runs, letting a crafted title break out and
      # execute arbitrary commands on the runner.
      - name: Check title length
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          len=$(printf '%s' "$TITLE" | wc -m)
          if [ "$len" -gt 70 ]; then
            echo "::error::PR title is $len characters (limit 70, leaving room for the \" (#123)\" GitHub appends on squash-merge): $TITLE"
            exit 1
          fi

      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary after "type: " (or "type(scope): ") must start with a lowercase
            letter, e.g. "feat: add X", not "feat: Add X".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
